<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satış Ligi · Lara Smile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#081221;
    --bg-panel:#0F1E33;
    --bg-panel-2:#132743;
    --border:#1D3655;
    --teal:#2FD9C4;
    --teal-dim:#1B7A6E;
    --gold:#F4B740;
    --silver:#C7D1DC;
    --bronze:#D98E4D;
    --text:#EAF3F5;
    --muted:#7C93AC;
    --danger:#FF6B6B;
    --font-display:'Sora', 'Segoe UI', Arial, sans-serif;
    --font-body:'Inter', 'Segoe UI', Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background:
      radial-gradient(ellipse 90% 60% at 50% -10%, rgba(47,217,196,0.10), transparent 60%),
      radial-gradient(ellipse 70% 50% at 85% 100%, rgba(244,183,64,0.06), transparent 60%),
      var(--bg-deep);
    color:var(--text);
    font-family:var(--font-body);
    overflow-x:hidden;
  }
  ::selection{background:var(--teal); color:#04140F;}

  /* ---------- layout shell ---------- */
  .stage{
    min-height:100vh;
    padding:28px clamp(20px,4vw,56px) 60px;
    position:relative;
    z-index:1;
  }

  /* ---------- header ---------- */
  header.top{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap:24px; margin-bottom:30px; flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:16px; }
  .brand-mark{
    width:52px; height:52px; border-radius:14px;
    background:linear-gradient(145deg, var(--teal), var(--teal-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:22px; color:#04140F;
    box-shadow:0 0 24px rgba(47,217,196,0.35);
    flex:none;
  }
  .brand-text .eyebrow{
    font-family:var(--font-body); font-size:12px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--teal); font-weight:600; margin:0 0 2px;
  }
  .brand-text h1{
    font-family:var(--font-display); font-weight:800; font-size:clamp(22px,2.6vw,32px);
    margin:0; letter-spacing:.01em;
  }
  .brand-text .sub{ color:var(--muted); font-size:13px; margin-top:4px; }

  .clock-block{ text-align:right; }
  .clock-block .time{
    font-family:var(--font-display); font-weight:700; font-size:clamp(24px,3vw,34px);
    letter-spacing:.02em; line-height:1;
  }
  .clock-block .date{ color:var(--muted); font-size:13px; margin-top:6px; text-transform:capitalize; }

  /* ---------- stat strip ---------- */
  .stat-strip{
    display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;
  }
  .stat-card{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border); border-radius:16px;
    padding:18px 22px; position:relative; overflow:hidden;
  }
  .stat-card::after{
    content:''; position:absolute; inset:0;
    background:linear-gradient(120deg, transparent 40%, rgba(47,217,196,0.06) 50%, transparent 60%);
    pointer-events:none;
  }
  .stat-card .label{ font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; font-weight:600; }
  .stat-card .value{ font-family:var(--font-display); font-weight:800; font-size:clamp(26px,3vw,36px); margin-top:6px; }
  .stat-card .value span{ font-size:16px; color:var(--muted); font-weight:600; margin-left:6px;}
  .stat-card.accent .value{ color:var(--teal); }
  .stat-card.gold .value{ color:var(--gold); }

  /* ---------- podium ---------- */
  .section-title{
    font-family:var(--font-display); font-weight:700; font-size:14px;
    letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
    margin:0 0 16px; display:flex; align-items:center; gap:10px;
  }
  .section-title::before{
    content:''; width:22px; height:2px; background:var(--teal); display:inline-block; border-radius:2px;
  }

  .board-header{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin-bottom:16px;
  }
  .board-header .section-title{ margin:0; }
  .filter-pills{
    display:flex; gap:4px; background:rgba(255,255,255,.03); padding:4px;
    border-radius:999px; border:1px solid var(--border);
  }
  .pill{
    font-family:var(--font-body); font-weight:600; font-size:12.5px;
    padding:8px 18px; border-radius:999px; border:none; background:transparent;
    color:var(--muted); cursor:pointer; transition:background .2s, color .2s;
  }
  .pill.active{ background:var(--teal); color:#04140F; }
  .pill:hover:not(.active){ color:var(--text); }

  .podium{
    display:flex; align-items:flex-end; justify-content:center; gap:clamp(10px,2vw,28px);
    margin-bottom:26px; min-height:220px;
  }
  .pod-slot{
    display:flex; flex-direction:column; align-items:center; width:clamp(120px,16vw,220px);
    transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .pod-avatar{
    width:74px; height:74px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:26px;
    color:#04140F; margin-bottom:10px; position:relative;
    box-shadow:0 6px 22px rgba(0,0,0,.35);
  }
  .pod-slot.rank-1 .pod-avatar{ background:linear-gradient(145deg,#FFE39A,var(--gold)); width:92px; height:92px; font-size:32px;}
  .pod-slot.rank-2 .pod-avatar{ background:linear-gradient(145deg,#E9EEF3,var(--silver)); }
  .pod-slot.rank-3 .pod-avatar{ background:linear-gradient(145deg,#F0B27E,var(--bronze)); }
  .crown{ position:absolute; top:-26px; font-size:26px; filter:drop-shadow(0 0 8px rgba(244,183,64,.8)); animation:bob 2.4s ease-in-out infinite; }
  @keyframes bob{ 0%,100%{transform:translateY(0) rotate(-4deg);} 50%{transform:translateY(-5px) rotate(4deg);} }

  .pod-name{ font-family:var(--font-display); font-weight:700; font-size:16px; }
  .pod-count{ font-family:var(--font-display); font-weight:800; font-size:22px; margin-top:2px; }
  .pod-slot.rank-1 .pod-count{ color:var(--gold); font-size:28px; }
  .pod-slot.rank-2 .pod-count{ color:var(--silver); }
  .pod-slot.rank-3 .pod-count{ color:var(--bronze); }
  .pod-label{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; margin-top:2px;}
  .pod-sub{ font-size:11px; color:var(--muted); margin-top:4px; font-weight:600; }

  .pod-bar{
    width:100%; margin-top:14px; border-radius:12px 12px 0 0;
    background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
    border:1px solid var(--border); border-bottom:none;
    display:flex; align-items:flex-start; justify-content:center; padding-top:8px;
    position:relative; overflow:hidden;
    transition:height .6s cubic-bezier(.2,.8,.2,1);
  }
  .pod-bar::before{
    content:''; position:absolute; inset:0; opacity:.5;
    background:linear-gradient(180deg, transparent, rgba(47,217,196,.12));
  }
  .pod-slot.rank-1 .pod-bar{ height:128px; border-color:rgba(244,183,64,.5); box-shadow:0 0 30px rgba(244,183,64,.15) inset;}
  .pod-slot.rank-2 .pod-bar{ height:88px; }
  .pod-slot.rank-3 .pod-bar{ height:58px; }
  .pod-rank-num{ font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--muted); }

  .pod-empty{ text-align:center; color:var(--muted); font-size:14px; padding:40px 0; width:100%; }

  /* ---------- leaderboard list ---------- */
  .board{
    background:linear-gradient(180deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--border); border-radius:18px; padding:10px;
  }
  .row{
    display:grid; grid-template-columns:44px 150px 1fr 56px 82px;
    align-items:center; gap:14px; padding:9px 14px; border-radius:12px;
    position:relative; transition:transform .5s cubic-bezier(.2,.8,.2,1);
  }
  .row + .row{ margin-top:1px; }
  .row.top3{ background:rgba(47,217,196,0.04); }
  .rank-num{
    font-family:var(--font-display); font-weight:800; font-size:18px; color:var(--muted); text-align:center;
  }
  .row:nth-child(1) .rank-num{ color:var(--gold); }
  .row:nth-child(2) .rank-num{ color:var(--silver); }
  .row:nth-child(3) .rank-num{ color:var(--bronze); }
  .name-cell{ display:flex; flex-direction:column; gap:1px; overflow:hidden; min-width:0; }
  .agent-name{ font-family:var(--font-display); font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .agent-sub{ font-size:11px; color:var(--muted); font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar-track{
    background:rgba(255,255,255,.05); border-radius:8px; height:22px; overflow:hidden; position:relative;
  }
  .bar-fill{
    height:100%; border-radius:8px;
    background:linear-gradient(90deg, var(--teal-dim), var(--teal));
    transition:width .8s cubic-bezier(.2,.8,.2,1);
    position:relative;
  }
  .bar-fill.pulse{ animation:pulseGlow 1.1s ease-out; }
  @keyframes pulseGlow{
    0%{ box-shadow:0 0 0px rgba(244,183,64,0); filter:brightness(1);}
    30%{ box-shadow:0 0 24px rgba(244,183,64,.8); filter:brightness(1.5);}
    100%{ box-shadow:0 0 0px rgba(244,183,64,0); filter:brightness(1);}
  }
  .sales-count{ font-family:var(--font-display); font-weight:800; font-size:18px; text-align:right; }
  .row-actions{ display:flex; gap:6px; justify-content:flex-end; }
  .row-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--border);
    background:rgba(255,255,255,.03); color:var(--text); cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-body); font-weight:700;
    transition:background .15s, transform .1s, border-color .15s;
  }
  .row-btn:active{ transform:scale(.92); }
  .row-btn.plus{ color:var(--teal); border-color:var(--teal-dim); background:rgba(47,217,196,.06); }
  .row-btn.plus:hover{ background:rgba(47,217,196,.16); }
  .row-btn.minus{ color:var(--muted); font-size:18px; opacity:.55; }
  .row-btn.minus:hover{ opacity:1; background:rgba(255,255,255,.08); }
  .empty-state{ text-align:center; color:var(--muted); padding:48px 20px; font-size:15px; }

  /* ---------- floating toast ---------- */
  #toast-layer{
    position:fixed; top:24px; left:50%; transform:translateX(-50%);
    z-index:60; display:flex; flex-direction:column; gap:10px; align-items:center;
    pointer-events:none;
  }
  .toast{
    font-family:var(--font-display); font-weight:700; font-size:clamp(16px,2.2vw,22px);
    background:linear-gradient(135deg, rgba(244,183,64,.95), rgba(217,142,77,.95));
    color:#211102; padding:14px 28px; border-radius:999px;
    box-shadow:0 10px 40px rgba(244,183,64,.4);
    animation:toastIn .45s cubic-bezier(.2,.8,.2,1), toastOut .5s ease-in forwards 2.6s;
    white-space:nowrap;
  }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-30px) scale(.85);} to{ opacity:1; transform:translateY(0) scale(1);} }
  @keyframes toastOut{ to{ opacity:0; transform:translateY(-16px) scale(.92);} }

  /* ---------- fireworks / confetti canvas ---------- */
  #fx-canvas{ position:fixed; inset:0; pointer-events:none; z-index:50; }

  /* ---------- admin gear + panel ---------- */
  #gear-btn{
    position:fixed; top:112px; right:22px; z-index:70;
    width:46px; height:46px; border-radius:50%;
    background:rgba(255,255,255,.04); border:1px solid var(--border);
    color:var(--muted); font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    opacity:.35; transition:opacity .2s, transform .2s, background .2s;
  }
  #gear-btn:hover{ opacity:1; transform:rotate(35deg); background:rgba(47,217,196,.1); color:var(--teal); }

  #admin-overlay{
    position:fixed; inset:0; background:rgba(3,8,16,.72); backdrop-filter:blur(4px);
    z-index:80; display:none; align-items:center; justify-content:center; padding:20px;
  }
  #admin-overlay.open{ display:flex; }
  .admin-panel{
    width:min(560px,92vw); max-height:86vh; overflow-y:auto;
    background:var(--bg-panel-2); border:1px solid var(--border); border-radius:20px;
    padding:26px; box-shadow:0 30px 80px rgba(0,0,0,.5);
  }
  .admin-panel h2{ font-family:var(--font-display); margin:0 0 4px; font-size:20px; }
  .admin-panel .hint{ color:var(--muted); font-size:13px; margin:0 0 20px; }
  .admin-add{ display:flex; gap:10px; margin-bottom:22px; }
  .admin-add input{
    flex:1; background:rgba(255,255,255,.04); border:1px solid var(--border);
    border-radius:10px; padding:11px 14px; color:var(--text); font-family:var(--font-body); font-size:14px;
  }
  .admin-add input:focus{ outline:none; border-color:var(--teal); }
  .btn{
    font-family:var(--font-body); font-weight:600; font-size:14px; border:none; border-radius:10px;
    padding:11px 18px; cursor:pointer; transition:filter .15s, transform .1s;
  }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--teal); color:#04140F; }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-ghost{ background:rgba(255,255,255,.06); color:var(--text); }
  .btn-ghost:hover{ background:rgba(255,255,255,.1); }
  .btn-danger{ background:rgba(255,107,107,.12); color:var(--danger); }
  .btn-danger:hover{ background:rgba(255,107,107,.22); }

  .admin-row{
    display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--border);
  }
  .admin-row:last-child{ border-bottom:none; }
  .admin-row .name{ flex:1; font-weight:600; font-size:14px; }
  .admin-row .count{ font-family:var(--font-display); font-weight:700; font-size:13px; color:var(--muted); }
  .icon-btn{
    width:34px; height:34px; border-radius:9px; border:1px solid var(--border);
    background:rgba(255,255,255,.03); color:var(--text); cursor:pointer; font-size:15px;
    display:flex; align-items:center; justify-content:center; font-family:var(--font-body); font-weight:700;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.08); }
  .icon-btn.plus{ color:var(--teal); border-color:var(--teal-dim); }
  .icon-btn.minus{ color:var(--muted); }
  .icon-btn.del{ color:var(--danger); border-color:rgba(255,107,107,.3); }

  .admin-footer{ margin-top:20px; display:flex; justify-content:space-between; gap:10px; }
  .close-x{
    position:absolute; top:16px; right:18px; background:none; border:none; color:var(--muted);
    font-size:20px; cursor:pointer;
  }
  .admin-panel{ position:relative; }

  @media (max-width:640px){
    .stat-strip{ grid-template-columns:1fr; }
    .row{ grid-template-columns:28px 80px 1fr 40px 64px; gap:8px; }
    .podium{ gap:8px; }
  }
</style>
</head>
<body>

<canvas id="fx-canvas"></canvas>
<div id="toast-layer"></div>

<div class="stage">
  <header class="top">
    <div class="brand">
      <div class="brand-mark">LS</div>
      <div class="brand-text">
        <p class="eyebrow">Lara Smile</p>
        <h1>Satış Ligi</h1>
        <p class="sub" id="period-label">Temmuz 2026</p>
      </div>
    </div>
    <div class="clock-block">
      <div class="time" id="clock">00:00</div>
      <div class="date" id="date"></div>
    </div>
  </header>

  <section class="stat-strip">
    <div class="stat-card accent">
      <div class="label">Bu Ay Toplam Satış</div>
      <div class="value" id="stat-total">0</div>
    </div>
    <div class="stat-card accent">
      <div class="label">Bu Ay Toplam Ciro</div>
      <div class="value" id="stat-revenue">£0</div>
    </div>
    <div class="stat-card gold">
      <div class="label">Lider</div>
      <div class="value" id="stat-leader">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Aktif Temsilci</div>
      <div class="value" id="stat-agents">0</div>
    </div>
  </section>

  <p class="section-title">Podyum</p>
  <div class="podium" id="podium"></div>

  <div class="board-header">
    <p class="section-title">Sıralama</p>
    <div class="filter-pills">
      <button class="pill" data-mode="sales" id="pill-sales">Satışa Göre</button>
      <button class="pill" data-mode="revenue" id="pill-revenue">Ciroya Göre</button>
    </div>
  </div>
  <div class="board" id="board"></div>
</div>

<button id="gear-btn" title="Yönetim paneli">⚙</button>

<div id="admin-overlay">
  <div class="admin-panel">
    <button class="close-x" id="admin-close">✕</button>
    <h2>Yönetim Paneli</h2>
    <p class="hint">Temsilci ekle ya da çıkar. Satış eklemek için sıralamadaki <strong>+</strong> butonunu kullan.</p>

    <div class="admin-add">
      <input type="text" id="new-agent-name" placeholder="Yeni temsilci adı (örn. Kaan)">
      <button class="btn btn-primary" id="add-agent-btn">Ekle</button>
    </div>

    <div id="admin-list"></div>

    <div class="admin-footer">
      <button class="btn btn-ghost" id="reset-month-btn">Ayı Sıfırla</button>
      <button class="btn btn-danger" id="clear-all-btn">Tümünü Sil</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
(function(){
  "use strict";

  /* ---------------- state (Firebase Realtime Database) ---------------- */
  var celebrationColors = ['#2FD9C4','#F4B740','#FF6B6B','#C7D1DC','#7CE7D6','#FFD98A'];
  var dbRef = firebase.database().ref('satis_ligi_state');
  var state = { agents: [], sortMode: 'sales' };
  var firstLoad = true;

  function migrateState(){
    if(!state.agents) state.agents = [];
    if(state.sortMode !== 'sales' && state.sortMode !== 'revenue') state.sortMode = 'sales';
    state.agents.forEach(function(a){
      if(typeof a.revenue !== 'number') a.revenue = 0;
      if(!Array.isArray(a.log)) a.log = [];
    });
  }

  function saveState(){
    dbRef.set(state).catch(function(err){
      console.error('Firebase kayıt hatası:', err);
    });
  }

  dbRef.on('value', function(snapshot){
    var data = snapshot.val();
    state = data || { agents: [], sortMode: 'sales' };
    migrateState();
    renderBoard();
    refreshPills();
    if(overlay.classList.contains('open')) renderAdmin();
    firstLoad = false;
  }, function(err){
    console.error('Firebase bağlantı hatası:', err);
  });

  function formatTL(n){
    n = Math.round(n || 0);
    return '£' + n.toLocaleString('tr-TR');
  }

  function uid(){ return 'a' + Math.random().toString(36).slice(2,9); }

  /* ---------------- clock ---------------- */
  var months = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  var days = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
  function tickClock(){
    var now = new Date();
    var hh = String(now.getHours()).padStart(2,'0');
    var mm = String(now.getMinutes()).padStart(2,'0');
    document.getElementById('clock').textContent = hh+':'+mm;
    document.getElementById('date').textContent = days[now.getDay()] + ', ' + now.getDate() + ' ' + months[now.getMonth()];
    document.getElementById('period-label').textContent = months[now.getMonth()] + ' ' + now.getFullYear();
  }
  tickClock();
  setInterval(tickClock, 15000);

  /* ---------------- rendering ---------------- */
  var boardEl = document.getElementById('board');
  var podiumEl = document.getElementById('podium');

  function sortedAgents(){
    var mode = state.sortMode;
    return state.agents.slice().sort(function(a,b){
      return mode === 'revenue' ? (b.revenue - a.revenue) : (b.sales - a.sales);
    });
  }

  function initials(name){
    var parts = name.trim().split(/\s+/);
    if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
    return (parts[0][0] + parts[1][0]).toUpperCase();
  }

  // Keep track of previous rects for FLIP animation on reorder
  function renderBoard(highlightId){
    var list = sortedAgents();
    var mode = state.sortMode;
    var maxVal = Math.max(1, list[0] ? (mode === 'revenue' ? list[0].revenue : list[0].sales) : 0);

    // capture "first" positions
    var firstRects = {};
    Array.prototype.forEach.call(boardEl.children, function(el){
      firstRects[el.dataset.id] = el.getBoundingClientRect();
    });

    if(list.length === 0){
      boardEl.innerHTML = '<div class="empty-state">Henüz temsilci eklenmedi. Sağ alttaki ⚙ simgesine dokunarak ekibi ekleyin.</div>';
    } else {
      boardEl.innerHTML = '';
      list.forEach(function(agent, idx){
        var row = document.createElement('div');
        row.className = 'row' + (idx < 3 ? ' top3' : '');
        row.dataset.id = agent.id;
        var val = mode === 'revenue' ? agent.revenue : agent.sales;
        var pct = Math.max(3, Math.round((val / maxVal) * 100));
        var primary = mode === 'revenue' ? formatTL(agent.revenue) : String(agent.sales);
        var subtext = mode === 'revenue' ? (agent.sales + ' satış') : formatTL(agent.revenue);
        row.innerHTML =
          '<div class="rank-num">'+(idx+1)+'</div>'+
          '<div class="name-cell"><div class="agent-name">'+escapeHtml(agent.name)+'</div><div class="agent-sub">'+subtext+'</div></div>'+
          '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%"></div></div>'+
          '<div class="sales-count">'+primary+'</div>'+
          '<div class="row-actions">'+
            '<button class="row-btn minus" data-act="minus" data-id="'+agent.id+'" title="Son satışı geri al">−</button>'+
            '<button class="row-btn plus" data-act="plus" data-id="'+agent.id+'" title="Satış ekle">+</button>'+
          '</div>';
        boardEl.appendChild(row);
      });
    }

    // FLIP: invert + play
    Array.prototype.forEach.call(boardEl.children, function(el){
      var id = el.dataset.id;
      var first = firstRects[id];
      if(first){
        var last = el.getBoundingClientRect();
        var dy = first.top - last.top;
        if(dy){
          el.style.transform = 'translateY('+dy+'px)';
          el.style.transition = 'none';
          requestAnimationFrame(function(){
            el.style.transition = 'transform .5s cubic-bezier(.2,.8,.2,1)';
            el.style.transform = 'translateY(0)';
          });
        }
      }
      if(id === highlightId){
        var fill = el.querySelector('.bar-fill');
        if(fill){
          fill.classList.remove('pulse');
          void fill.offsetWidth;
          fill.classList.add('pulse');
        }
      }
    });

    renderPodium(list);
    renderStats(list);
  }

  function renderPodium(list){
    if(list.length === 0){
      podiumEl.innerHTML = '<div class="pod-empty">Podyum, ilk satış işlendiğinde canlanacak 🏆</div>';
      return;
    }
    var mode = state.sortMode;
    var order = [ list[1], list[0], list[2] ]; // 2nd, 1st, 3rd for visual centering
    var ranks  = [2,1,3];
    var html = '';
    order.forEach(function(agent, i){
      if(!agent){
        html += '<div class="pod-slot rank-'+ranks[i]+'"></div>';
        return;
      }
      var rank = ranks[i];
      var primary = mode === 'revenue' ? formatTL(agent.revenue) : String(agent.sales);
      var unitLabel = mode === 'revenue' ? 'ciro' : 'satış';
      var subtext = mode === 'revenue' ? (agent.sales + ' satış') : formatTL(agent.revenue);
      html +=
        '<div class="pod-slot rank-'+rank+'">'+
          '<div class="pod-avatar">'+
            (rank===1 ? '<span class="crown">👑</span>' : '') +
            initials(agent.name) +
          '</div>'+
          '<div class="pod-name">'+escapeHtml(agent.name)+'</div>'+
          '<div class="pod-count">'+primary+'</div>'+
          '<div class="pod-label">'+unitLabel+'</div>'+
          '<div class="pod-sub">'+subtext+'</div>'+
          '<div class="pod-bar"><span class="pod-rank-num">#'+rank+'</span></div>'+
        '</div>';
    });
    podiumEl.innerHTML = html;
  }

  function renderStats(list){
    var totalSales = list.reduce(function(s,a){ return s + a.sales; }, 0);
    var totalRevenue = list.reduce(function(s,a){ return s + a.revenue; }, 0);
    document.getElementById('stat-total').textContent = totalSales;
    document.getElementById('stat-revenue').textContent = formatTL(totalRevenue);
    document.getElementById('stat-agents').textContent = list.length;
    document.getElementById('stat-leader').textContent = list.length ? list[0].name : '—';
  }

  function escapeHtml(str){
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  boardEl.addEventListener('click', function(e){
    var btn = e.target.closest('.row-btn');
    if(!btn) return;
    var id = btn.dataset.id;
    var act = btn.dataset.act;
    var agent = state.agents.find(function(a){ return a.id === id; });
    if(!agent) return;

    if(act === 'plus'){
      var raw = window.prompt(agent.name + ' — bu satışın ciro tutarını girin (£):', '');
      if(raw === null) return; // vazgeçildi
      raw = raw.trim().replace(/\./g,'').replace(',', '.');
      var amount = raw === '' ? 0 : parseFloat(raw);
      if(isNaN(amount) || amount < 0){
        alert('Geçerli bir tutar girin (örn. 15000).');
        return;
      }
      agent.sales += 1;
      agent.revenue += amount;
      agent.log.push(amount);
      saveState();
      renderBoard(id);
      celebrate(agent, amount);
    } else if(act === 'minus'){
      if(agent.sales <= 0) return;
      var lastAmount = agent.log.length ? agent.log.pop() : 0;
      agent.sales = Math.max(0, agent.sales - 1);
      agent.revenue = Math.max(0, agent.revenue - lastAmount);
      saveState();
      renderBoard(id);
    }
  });

  /* ---------------- sort filter pills ---------------- */
  var pillSales = document.getElementById('pill-sales');
  var pillRevenue = document.getElementById('pill-revenue');
  function refreshPills(){
    pillSales.classList.toggle('active', state.sortMode === 'sales');
    pillRevenue.classList.toggle('active', state.sortMode === 'revenue');
  }
  pillSales.addEventListener('click', function(){
    state.sortMode = 'sales'; saveState(); refreshPills(); renderBoard();
  });
  pillRevenue.addEventListener('click', function(){
    state.sortMode = 'revenue'; saveState(); refreshPills(); renderBoard();
  });
  refreshPills();

  /* ---------------- admin panel ---------------- */
  var overlay = document.getElementById('admin-overlay');
  var adminList = document.getElementById('admin-list');

  document.getElementById('gear-btn').addEventListener('click', function(){
    overlay.classList.add('open');
    renderAdmin();
  });
  document.getElementById('admin-close').addEventListener('click', closeAdmin);
  overlay.addEventListener('click', function(e){ if(e.target === overlay) closeAdmin(); });
  function closeAdmin(){ overlay.classList.remove('open'); }

  function renderAdmin(){
    var list = sortedAgents();
    if(list.length === 0){
      adminList.innerHTML = '<p class="hint" style="margin:0;">Henüz temsilci yok.</p>';
      return;
    }
    adminList.innerHTML = '';
    list.forEach(function(agent){
      var row = document.createElement('div');
      row.className = 'admin-row';
      row.innerHTML =
        '<div class="name">'+escapeHtml(agent.name)+'</div>'+
        '<div class="count">'+agent.sales+' satış · '+formatTL(agent.revenue)+'</div>'+
        '<button class="icon-btn del" data-act="del" data-id="'+agent.id+'" title="Temsilciyi sil">🗑</button>';
      adminList.appendChild(row);
    });
  }

  adminList.addEventListener('click', function(e){
    var btn = e.target.closest('.icon-btn');
    if(!btn) return;
    var id = btn.dataset.id;
    var act = btn.dataset.act;
    var agent = state.agents.find(function(a){ return a.id === id; });
    if(!agent) return;

    if(act === 'del'){
      if(confirm(escapeHtml(agent.name)+' silinsin mi?')){
        state.agents = state.agents.filter(function(a){ return a.id !== id; });
        saveState();
        renderAdmin();
        renderBoard();
      }
    }
  });

  document.getElementById('add-agent-btn').addEventListener('click', addAgent);
  document.getElementById('new-agent-name').addEventListener('keydown', function(e){
    if(e.key === 'Enter') addAgent();
  });
  function addAgent(){
    var input = document.getElementById('new-agent-name');
    var name = input.value.trim();
    if(!name) return;
    state.agents.push({ id: uid(), name: name, sales: 0, revenue: 0, log: [] });
    input.value = '';
    saveState();
    renderAdmin();
    renderBoard();
  }

  document.getElementById('reset-month-btn').addEventListener('click', function(){
    if(!confirm('Tüm temsilcilerin satış ve ciro rakamları sıfırlansın mı? (Temsilciler silinmez)')) return;
    state.agents.forEach(function(a){ a.sales = 0; a.revenue = 0; a.log = []; });
    saveState();
    renderAdmin();
    renderBoard();
  });
  document.getElementById('clear-all-btn').addEventListener('click', function(){
    if(!confirm('Tüm temsilciler ve veriler kalıcı olarak silinsin mi?')) return;
    state.agents = [];
    saveState();
    renderAdmin();
    renderBoard();
  });

  /* keyboard shortcut: press "a" to toggle admin, "Escape" to close */
  document.addEventListener('keydown', function(e){
    if(e.key === 'a' || e.key === 'A'){
      if(document.activeElement && (document.activeElement.tagName === 'INPUT')) return;
      overlay.classList.toggle('open');
      if(overlay.classList.contains('open')) renderAdmin();
    }
    if(e.key === 'Escape') closeAdmin();
  });

  /* ---------------- toast ---------------- */
  function showToast(text){
    var layer = document.getElementById('toast-layer');
    var t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    layer.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3200);
  }

  /* ---------------- sound (WebAudio chime) ---------------- */
  var audioCtx = null;
  function playChime(){
    try{
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      var notes = [523.25, 659.25, 783.99, 1046.50]; // C5 E5 G5 C6
      notes.forEach(function(freq, i){
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq;
        var start = audioCtx.currentTime + i * 0.09;
        gain.gain.setValueAtTime(0, start);
        gain.gain.linearRampToValueAtTime(0.18, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.5);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(start);
        osc.stop(start + 0.55);
      });
    }catch(e){}
  }

  /* ---------------- fireworks / confetti canvas ---------------- */
  var canvas = document.getElementById('fx-canvas');
  var ctx = canvas.getContext('2d');
  var particles = [];
  var rafId = null;

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  function randRange(a,b){ return a + Math.random()*(b-a); }

  function spawnFirework(x, y){
    var color = celebrationColors[Math.floor(Math.random()*celebrationColors.length)];
    var count = 46;
    for(var i=0;i<count;i++){
      var angle = (Math.PI*2*i)/count + randRange(-0.08,0.08);
      var speed = randRange(2.6, 6.2);
      particles.push({
        x:x, y:y,
        vx:Math.cos(angle)*speed,
        vy:Math.sin(angle)*speed,
        life:0, maxLife:randRange(50,80),
        color:color, size:randRange(1.6,3.2), type:'spark', gravity:0.045
      });
    }
  }

  function spawnConfettiBurst(x, y){
    for(var i=0;i<32;i++){
      var color = celebrationColors[Math.floor(Math.random()*celebrationColors.length)];
      particles.push({
        x:x, y:y,
        vx:randRange(-4.5,4.5),
        vy:randRange(-8,-3),
        life:0, maxLife:randRange(70,110),
        color:color, size:randRange(4,7), type:'confetti',
        rot:randRange(0,Math.PI*2), rotSpeed:randRange(-0.2,0.2), gravity:0.14
      });
    }
  }

  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles = particles.filter(function(p){ return p.life < p.maxLife; });

    particles.forEach(function(p){
      p.life++;
      p.vy += p.gravity;
      p.x += p.vx;
      p.y += p.vy;
      var alpha = 1 - (p.life / p.maxLife);

      if(p.type === 'spark'){
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
        ctx.fill();
      } else {
        p.rot += p.rotSpeed;
        ctx.globalAlpha = Math.max(0, alpha);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size*0.6);
        ctx.restore();
      }
    });
    ctx.globalAlpha = 1;

    if(particles.length > 0){
      rafId = requestAnimationFrame(animate);
    } else {
      rafId = null;
    }
  }

  function ensureAnimating(){
    if(!rafId) rafId = requestAnimationFrame(animate);
  }

  function celebrate(agent, amount){
    var msg = '🎉 ' + agent.name + ' yeni satış yaptı!';
    if(amount){ msg += ' (' + formatTL(amount) + ')'; }
    showToast(msg);
    playChime();

    // multiple firework bursts across the top of the screen
    var w = canvas.width, h = canvas.height;
    var bursts = [
      [w*0.2, h*0.28],
      [w*0.5, h*0.18],
      [w*0.8, h*0.3]
    ];
    bursts.forEach(function(pos, i){
      setTimeout(function(){ spawnFirework(pos[0], pos[1]); ensureAnimating(); }, i*220);
    });
    // confetti rain from top
    for(var i=0;i<3;i++){
      setTimeout(function(){
        spawnConfettiBurst(randRange(w*0.1,w*0.9), h*0.1);
        ensureAnimating();
      }, i*160 + 100);
    }
  }

  /* ---------------- init ---------------- */
  /* İlk render, Firebase'den veri geldiğinde dbRef.on('value', ...) içinde tetiklenir. */
})();
</script>
</body>
